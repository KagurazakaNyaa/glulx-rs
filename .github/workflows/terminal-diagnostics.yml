name: terminal diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attributes:
    strategy:
      fail-fast: false
      matrix:
        # Compare the current macOS behavior with the passing current Linux host.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Same latest stable major/Python policy as the release workflow.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
          allow-prereleases: false
      - name: Diagnose kernel terminal-attribute round trip
        run: |
          python - <<'PY'
          import os, platform, pty, termios, tty
          master, slave = pty.openpty()
          try:
              before = termios.tcgetattr(slave)
              tty.setraw(slave)
              termios.tcsetattr(slave, termios.TCSANOW, before)
              after = termios.tcgetattr(slave)
              print(platform.platform(), flush=True)
              print('before:', repr(before), flush=True)
              print('after: ', repr(after), flush=True)
              print('lflag delta:', hex(before[3] ^ after[3]), flush=True)
              print('PENDIN:', hex(getattr(termios, 'PENDIN', 0)), flush=True)
              for flag in ['ICANON', 'ECHO', 'ISIG', 'IEXTEN']:
                  bit = getattr(termios, flag)
                  print(flag, bool(before[3] & bit), bool(after[3] & bit), flush=True)
              assert before == after, 'Exact terminal attributes changed after restoring the original value'
          finally:
              os.close(master)
              os.close(slave)
          PY
