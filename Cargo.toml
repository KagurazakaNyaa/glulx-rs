[package]
name = "glulx-rs"
version = "0.1.0"
edition = "2024"
description = "A cross-platform Glulx virtual machine and interactive fiction player"
license = "AGPL-3.0-only"
repository = "https://github.com/KagurazakaNyaa/glulx-rs"
homepage = "https://github.com/KagurazakaNyaa/glulx-rs"
documentation = "https://docs.rs/glulx-rs"

[dependencies]
ab_glyph = "0.2"
ttf-parser = "0.25"
crossterm = "0.29"
unicode-width = "0.2"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
thiserror = "2"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all", "symphonia-aiff"] }
# Rodio 0.20 enables the Vorbis codec but omits its Ogg container reader.
symphonia = { version = "0.5", default-features = false, features = ["ogg"] }
xmrs = { version = "0.15.2", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
xmrsplayer = { version = "0.15.0", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
self_cell = "1"
roxmltree = "0.20"
unicode-normalization = "0.1"
unicode-case-mapping = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
