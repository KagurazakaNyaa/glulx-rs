[package]
name = "glulx-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A cross-platform Glulx virtual machine and interactive fiction player"
license = "AGPL-3.0-only"
repository = "https://github.com/KagurazakaNyaa/glulx-rs"
homepage = "https://github.com/KagurazakaNyaa/glulx-rs"
documentation = "https://docs.rs/glulx-rs"

[dependencies]
sys-locale = "0.3"
ab_glyph = "0.2"
ttf-parser = "0.25"
crossterm = "0.29"
unicode-width = "0.2"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
same-file = "1"
libloading = "0.8"
thiserror = "2"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# The packet decoder needs container lengths for exact repeat and resume boundaries.
symphonia = { version = "0.6", default-features = false, features = ["all-formats", "all-codecs"] }
xmrs = { version = "0.15", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
xmrsplayer = { version = "0.15", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
self_cell = "1"
roxmltree = "0.21"
unicode-normalization = "0.1"
unicode-case-mapping = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# pprof-rs uses POSIX sampling signals; Windows exposes the same HTTP metrics
# service, but cannot link the native sampler.
pprof = { version = "0.15", default-features = false, features = ["flamegraph", "prost-codec"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Diagnostics_Etw", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Diagnostic binaries should run at normal speed while retaining assertions,
# debug symbols and the default diagnostic log.
[profile.diagnostic]
inherits = "release"
debug = 1
debug-assertions = true
strip = "none"

[build-dependencies]
winresource = "0.1"
